name: Competition A/B

# Same-runner A/B harness for the full-text index tuning challenge.
#
# The challenge scores a submission against a fixed baseline that was captured on
# the VLDB CI machine, so a GitHub-hosted runner can never reproduce the official
# number.  What a local comparison *can* show reliably is the relative effect of a
# patch, which is what decides whether an optimisation is worth keeping.
#
# Both variants are built from scratch with the same procedure, on one machine,
# and are then benchmarked back to back.  Building one variant incrementally
# would mix the patch with whatever the incremental rebuild happened to change,
# so the tree is discarded and rebuilt for the second variant as well.

on:
  workflow_dispatch:
  push:
    branches:
      - competition-ab

permissions:
  contents: read

env:
  SEEKDB_PORT: '2881'
  BEFORE_REF: '2026-competition'
  AFTER_REF: 'competition-opt'
  REPETITIONS: '3'
  # Files that carry the candidate optimisation.  Set to an empty value to
  # measure the same tree twice, which is the harness self-check.
  PATCH_FILES: 'src/storage/fts/ob_fts_stop_word.cpp src/sql/engine/expr/ob_expr_tokenize.cpp'

jobs:
  fts-ab:
    name: before / after on one runner
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Free Disk Space
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true
          tools-cache: false

      - name: Check out the A/B harness
        uses: actions/checkout@v4
        with:
          path: harness
          fetch-depth: 1

      - name: Check out the baseline branch
        uses: actions/checkout@v4
        with:
          path: before
          ref: ${{ env.BEFORE_REF }}
          fetch-depth: 1

      - name: Check out the candidate branch
        uses: actions/checkout@v4
        with:
          path: after
          ref: ${{ env.AFTER_REF }}
          fetch-depth: 1

      - name: Install build environment
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git wget rpm rpm2cpio cpio make build-essential binutils m4 \
            libtool-bin libncurses5 python3 python3-pip \
            libncurses-dev libaio-dev libaio1 libtool-bin

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-build-competition-ab-el9.x86_64-${{ hashFiles('before/deps/init/oceanbase.el9.x86_64.deps') }}
          path: before/deps/3rd

      - name: Build the baseline binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ~/.bashrc ]]; then source ~/.bashrc; fi
          cd before
          ./build.sh release --init
          make -C build_release -j4
          test -x build_release/src/observer/seekdb
          # Keep the baseline binary next to the candidate one so both resolve
          # their share files through the same relative path.
          cp build_release/src/observer/seekdb build_release/src/observer/seekdb_before

      - name: Apply the candidate patch
        shell: bash
        run: |
          set -euo pipefail
          cd before
          for file in $PATCH_FILES; do
            echo "patching $file"
            cp "../after/$file" "$file"
          done
          git --no-pager diff --stat || true
          # The candidate is built from scratch as well, so the comparison
          # measures the patch and not the rebuild.
          rm -rf build_release
          if [[ -f ~/.bashrc ]]; then source ~/.bashrc; fi
          ./build.sh release
          make -C build_release -j4
          test -x build_release/src/observer/seekdb
          cp build_release/src/observer/seekdb build_release/src/observer/seekdb_after

      - name: Benchmark the baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/reports"
          chmod +x before/.github/script/seekdb/*.py
          CLIENT="$GITHUB_WORKSPACE/before/deps/3rd/u01/obclient/bin/obclient"
          chmod +x "$CLIENT"
          python3 before/.github/script/seekdb/sdb.py start \
            --binary "$GITHUB_WORKSPACE/before/build_release/src/observer/seekdb_before" \
            --base-dir "$GITHUB_WORKSPACE/run_before" \
            --port "$SEEKDB_PORT" \
            --nodaemon
          python3 before/.github/script/seekdb/sdb.py wait-ready \
            --client "$CLIENT" \
            --base-dir "$GITHUB_WORKSPACE/run_before" \
            --host 127.0.0.1 \
            --port "$SEEKDB_PORT" \
            --user root
          export MYSQL="$CLIENT -h127.0.0.1 -P$SEEKDB_PORT -uroot -N -s --default-character-set=utf8mb4"
          export MYSQL_VERBOSE="$CLIENT -h127.0.0.1 -P$SEEKDB_PORT -uroot --default-character-set=utf8mb4"
          for rep in $(seq 1 "$REPETITIONS"); do
            export OUTPUT="$GITHUB_WORKSPACE/reports/before_${rep}.txt"
            export LABEL="before"
            (cd before && bash tools/benchmark/fts_large_bench.sh)
          done
          # The rows of a limited query and the tokens of the tokenizer are the
          # observable behaviour of the change, so they are captured as well.
          "$CLIENT" -h 127.0.0.1 -P"$SEEKDB_PORT" -uroot -N -s --default-character-set=utf8mb4 \
            -D fts_large_bench -e "
          select id from docs where MATCH(content) AGAINST('倒排索引 tokenizer') limit 20;
          select count(*) from docs where MATCH(title, content) AGAINST('全文索引 分词器');
          select tokenize('OceanBase 是一席非常稳定的数据库，全文索引的分词器热点包括解析器实例复用与停用词全局单例', 'ik');
          select tokenize('The quick brown fox jumps over the lazy dog. Full-text search indexing requires efficient tokenization.', 'beng');
          " > "$GITHUB_WORKSPACE/reports/probe_before.txt"
          python3 before/.github/script/seekdb/sdb.py destroy \
            --base-dir "$GITHUB_WORKSPACE/run_before"

      - name: Benchmark the candidate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x before/.github/script/seekdb/*.py
          CLIENT="$GITHUB_WORKSPACE/before/deps/3rd/u01/obclient/bin/obclient"
          chmod +x "$CLIENT"
          python3 before/.github/script/seekdb/sdb.py start \
            --binary "$GITHUB_WORKSPACE/before/build_release/src/observer/seekdb_after" \
            --base-dir "$GITHUB_WORKSPACE/run_after" \
            --port "$SEEKDB_PORT" \
            --nodaemon
          python3 before/.github/script/seekdb/sdb.py wait-ready \
            --client "$CLIENT" \
            --base-dir "$GITHUB_WORKSPACE/run_after" \
            --host 127.0.0.1 \
            --port "$SEEKDB_PORT" \
            --user root
          export MYSQL="$CLIENT -h127.0.0.1 -P$SEEKDB_PORT -uroot -N -s --default-character-set=utf8mb4"
          export MYSQL_VERBOSE="$CLIENT -h127.0.0.1 -P$SEEKDB_PORT -uroot --default-character-set=utf8mb4"
          for rep in $(seq 1 "$REPETITIONS"); do
            export OUTPUT="$GITHUB_WORKSPACE/reports/after_${rep}.txt"
            export LABEL="after"
            (cd before && bash tools/benchmark/fts_large_bench.sh)
          done
          "$CLIENT" -h 127.0.0.1 -P"$SEEKDB_PORT" -uroot -N -s --default-character-set=utf8mb4 \
            -D fts_large_bench -e "
          select id from docs where MATCH(content) AGAINST('倒排索引 tokenizer') limit 20;
          select count(*) from docs where MATCH(title, content) AGAINST('全文索引 分词器');
          select tokenize('OceanBase 是一席非常稳定的数据库，全文索引的分词器热点包括解析器实例复用与停用词全局单例', 'ik');
          select tokenize('The quick brown fox jumps over the lazy dog. Full-text search indexing requires efficient tokenization.', 'beng');
          " > "$GITHUB_WORKSPACE/reports/probe_after.txt"
          python3 before/.github/script/seekdb/sdb.py destroy \
            --base-dir "$GITHUB_WORKSPACE/run_after"

      - name: Score both reports against the fixed baseline
        shell: bash
        run: |
          set -euo pipefail
          cd before
          for rep in $(seq 1 "$REPETITIONS"); do
            python3 tools/benchmark/fts_large_bench_score.py \
              "$GITHUB_WORKSPACE/reports/before_${rep}.txt" --json \
              > "$GITHUB_WORKSPACE/reports/score_before_${rep}.json"
            python3 tools/benchmark/fts_large_bench_score.py \
              "$GITHUB_WORKSPACE/reports/after_${rep}.txt" --json \
              > "$GITHUB_WORKSPACE/reports/score_after_${rep}.json"
          done

      - name: Check that the observable behaviour did not change
        shell: bash
        run: |
          set -euo pipefail
          if ! diff -u "$GITHUB_WORKSPACE/reports/probe_before.txt" \
                       "$GITHUB_WORKSPACE/reports/probe_after.txt"; then
            echo "ERROR: the candidate returns different rows or different tokens" >&2
            exit 1
          fi
          echo "the rows of the limited query and the tokens are identical"

      - name: Compare before and after
        shell: bash
        run: |
          set -euo pipefail
          python3 harness/tools/benchmark/fts_ab_compare.py \
            --before "$GITHUB_WORKSPACE"/reports/before_*.txt \
            --after "$GITHUB_WORKSPACE"/reports/after_*.txt \
            --baseline before/tools/benchmark/fts_large_bench_baseline.json \
            --json "$GITHUB_WORKSPACE/reports/fts_ab_compare.json" \
            | tee "$GITHUB_WORKSPACE/reports/fts_ab_compare.txt"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fts-ab-report
          path: reports/
